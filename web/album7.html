<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>危险世界｜方大同</title>
    <style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft Yahei",sans-serif;}
body{
    color:#222;
    line-height:2.0;
    width:100%;
    min-height:100vh;
    margin:0;
    padding:0;
    overflow-x:hidden;
    background-color:#2c2018;
}
.album-bg{
    position:fixed;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background-repeat:no-repeat;
    background-position:center center;
    background-size:contain;
    z-index:-2;
}
.album-bg::after{
    content:"";
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:linear-gradient(135deg, rgba(0,0,0,0.45), rgba(60,30,10,0.55));
}
.box{
    background:rgba(255,255,255,0.45);
    backdrop-filter: blur(4px);
    padding:40px 60px;
    margin:120px auto 40px;
    width:92%;
    max-width:1200px;
    border-radius:20px;
    box-shadow:0 8px 24px rgba(0,0,0,0.12);
}
.box h3{
    color:#8c4820;
    border-left:6px solid #d6a87e;
    padding-left:16px;
    font-size:24px;
    margin-bottom:20px;
}
.box p{
    text-indent:2em;
    margin-bottom:18px;
    font-size:17px;
    color:#333;
}
.box p.noindent{
    text-indent:0;
}
.back-btn{
    display:block;
    width:fit-content;
    margin:0 auto 50px;
    padding:12px 30px;
    background:rgba(255,255,255,0.45);
    backdrop-filter: blur(4px);
    border-radius:30px;
    text-decoration:none;
    color:#8c4820;
    font-weight:bold;
    transition:0.3s;
    box-shadow:0 6px 16px rgba(0,0,0,0.12);
}
.back-btn:hover{
    opacity:0.8;
}
@media(max-width:768px){
    .box{padding:25px 20px;margin-top:90px;}
}
    </style>
</head>
<body>
    <div class="album-bg" style="background-image:url(../image/album7.jpg);"></div>
    <div class="box">
        <h3>危险世界（2014）</h3>
        <p>概念专辑，曲风更宏大，融合电子、R&B、摇滚，探讨现实世界，同名曲《危险世界》编曲冲击力很强。</p>
        <p>曲目列表：</p>
        <p class="noindent">1. 危险世界</p>
        <p class="noindent">2. 小方</p>
        <p class="noindent">3. 僵尸</p>
        <p class="noindent">4. welcome</p>
        <p class="noindent">5. 黑白灰</p>
        <p class="noindent">6. soundcheck</p>
        <p class="noindent">7. 天气先生</p>
        <p class="noindent">8. 枫叶做的风铃</p>
        <p class="noindent">9. 爱不来</p>
        <p class="noindent">10. 巴黎</p>
		<p class="noindent">11. 桃花运</p>
		<p class="noindent">12. weather report</p>
		<p class="noindent">13. boarding</p>
		<p class="noindent">14. lights up</p>
		<p class="noindent">15. peace</p>
		<p class="noindent">16. 特别的人</p>
    </div>
    <a href="albums.html" class="back-btn">← 返回专辑列表</a>
</body>
</html>
