<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>橙月｜方大同</title>
    <style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft Yahei",sans-serif;}
body{
    color:#222;
    line-height:2.0;
    width:100%;
    min-height:100vh;
    margin:0;
    padding:0;
    overflow-x:hidden;
    background-color:#2c2018;
}
.album-bg{
    position:fixed;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background-repeat:no-repeat;
    background-position:center center;
    background-size:contain;
    z-index:-2;
}
.album-bg::after{
    content:"";
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:linear-gradient(135deg, rgba(0,0,0,0.45), rgba(60,30,10,0.55));
}
.box{
    background:rgba(255,255,255,0.45);
    backdrop-filter: blur(4px);
    padding:40px 60px;
    margin:120px auto 40px;
    width:92%;
    max-width:1200px;
    border-radius:20px;
    box-shadow:0 8px 24px rgba(0,0,0,0.12);
}
.box h3{
    color:#8c4820;
    border-left:6px solid #d6a87e;
    padding-left:16px;
    font-size:24px;
    margin-bottom:20px;
}
.box p{
    text-indent:2em;
    margin-bottom:18px;
    font-size:17px;
    color:#333;
}
.box p.noindent{
    text-indent:0;
}
.back-btn{
    display:block;
    width:fit-content;
    margin:0 auto 50px;
    padding:12px 30px;
    background:rgba(255,255,255,0.45);
    backdrop-filter: blur(4px);
    border-radius:30px;
    text-decoration:none;
    color:#8c4820;
    font-weight:bold;
    transition:0.3s;
    box-shadow:0 6px 16px rgba(0,0,0,0.12);
}
.back-btn:hover{
    opacity:0.8;
}
@media(max-width:768px){
    .box{padding:25px 20px;margin-top:90px;}
}
    </style>
</head>
<body>
    <div class="album-bg" style="background-image:url(../image/album4.jpg);"></div>
    <div class="box">
        <h3>橙月（2008）</h3>
        <p>方大同知名度最高的一张专辑，温柔浪漫，《红豆》《小小虫》《为你写的歌》广为流传，橙月的氛围感被无数人喜爱。</p>
        <p>曲目列表：</p>
        <p class="noindent">1. 小小虫</p>
        <p class="noindent">2. 1234567</p>
        <p class="noindent">3. 黑白</p>
        <p class="noindent">4. 100种表情</p>
        <p class="noindent">5. singalongsong</p>
        <p class="noindent">6. 每个人都会</p>
        <p class="noindent">7. 如果爱</p>
        <p class="noindent">8. 黑洞里</p>
        <p class="noindent">9. 三人游</p>
        <p class="noindent">10. 为你写的歌</p>
		<p class="noindent">11. 爱我吧</p>
		<p class="noindent">12. orange moon</p>
    </div>
    <a href="albums.html" class="back-btn">← 返回专辑列表</a>
</body>
</html>
